<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ED7F14">
<meta name="robots" content="noindex">
<title>Seite nicht gefunden – Fest AM</title>
<style>
:root{--o:#ED7F14}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#222;background:#fff;line-height:1.55}
header.site{background:var(--o);padding:14px 20px}
header.site .brand{color:#fff;font-weight:700;font-size:1.2rem;text-decoration:none}
main{max-width:640px;margin:0 auto;padding:56px 20px;text-align:center}
h1{font-size:1.7rem;margin:0 0 .6rem}
p{color:#555;margin:.5rem 0}
a.btn{display:inline-block;margin-top:1.4rem;background:var(--o);color:#fff;text-decoration:none;padding:12px 24px;border-radius:8px;font-weight:600}
.hint{font-size:.82rem;color:#9a9a9a;margin-top:2.4rem}
</style>
</head>
<body>
<header class="site"><a class="brand" id="brand" href="/de-de/">Fest AM</a></header>
<main>
<h1>Seite nicht gefunden</h1>
<p>Diese Seite gibt es nicht (mehr) – vielleicht wurde ein Fest umbenannt oder der Link ist unvollständig.</p>
<a class="btn" id="home" href="/de-de/">Feste in deiner Nähe entdecken</a>
<p class="hint">Fehler 404</p>
</main>
<script>
(function(){
  var isLoc = function(s){ return /^[a-z][a-z]-[a-z][a-z]$/.test(s); };
  var segs = location.pathname.split('/').filter(function(s){ return s.length; });
  // Doppeltes Locale-Praefix (/de-de/de-de/...) -> zweite Locale entfernen und
  // auf die korrekte, einfache URL weiterleiten. Kein Loop: danach nur noch eine.
  if (segs.length >= 2 && isLoc(segs[0]) && isLoc(segs[1])) {
    segs.splice(1, 1);
    var last = segs[segs.length - 1] || '';
    var slash = last.indexOf('.') === -1 ? '/' : '';
    location.replace('/' + segs.join('/') + slash + location.search + location.hash);
    return;
  }
  // Sonst: Home-Link/Marke auf die erkannte Locale ausrichten (Fallback de-de).
  if (segs.length && isLoc(segs[0])) {
    var href = '/' + segs[0] + '/';
    document.getElementById('home').setAttribute('href', href);
    document.getElementById('brand').setAttribute('href', href);
  }
})();
</script>
</body>
</html>
